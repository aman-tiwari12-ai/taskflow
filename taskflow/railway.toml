[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm install && cd ../frontend && npm install && npm run build && cp -r build ../backend/public && cd ../backend && node seed.js"

[deploy]
startCommand = "node backend/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "taskflow-app"
